name: poc1

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: poc1
      - name: Unit tests
        run: cargo test --release --locked --manifest-path poc1/Cargo.toml
      - name: End-to-end upload
        run: poc1/scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc1-e2e
          path: |
            poc1/e2e-out/report.json
            poc1/e2e-out/summary.md
            poc1/e2e-out/server.log
