name: image-sequence

on:
  push:
    branches: [main]
    paths:
      - "image-sequence/**"
      - ".github/workflows/image-sequence.yml"
  pull_request:
    branches: [main]
    paths:
      - "image-sequence/**"
      - ".github/workflows/image-sequence.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-sequence
    steps:
      - uses: actions/checkout@v7

      # BtbN's prebuilt FFmpeg 9.0 shared build: libraries, headers, pkg-config
      # files and the ffmpeg binary, with libsvtav1 and libdav1d.
      - name: Install FFmpeg
        run: |
          prefix="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$prefix"
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz \
            | tar -xJ -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          # Not an rpath on our binaries: it would not reach the libraries'
          # own dependencies (libavdevice needs libavfilter), as BtbN's
          # libraries have no rpath of their own.
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: image-sequence

      - name: Restore the frames
        id: frames
        uses: actions/cache/restore@v6
        with:
          path: datasets/ImageSequence/001
          key: sepe-001-frames-000-059

      - name: Unit tests
        run: cargo test --release

      - name: End-to-end test
        run: scripts/e2e.sh

      - name: Save the frames
        if: always() && steps.frames.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: datasets/ImageSequence/001
          key: sepe-001-frames-000-059
