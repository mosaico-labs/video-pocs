[package]
name = "ffv1-analysis"
version = "0.1.0"
edition = "2024"
# `cargo run` runs the analysis; `prepare` builds its input.
default-run = "ffv1-analysis"

[dependencies]
anyhow = "1.0.104"
butteraugli = "0.9.3"
clap = { version = "4.6.7", features = ["derive"] }
ffmpeg-the-third = "6.0.0"
jpeg-encoder = "0.7.1"
png = "0.18.1"
rayon = "1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
