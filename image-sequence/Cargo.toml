[workspace]
resolver = "3"
members = ["crates/common", "crates/formats", "crates/client", "crates/server", "crates/quality"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
common = { path = "crates/common" }
formats = { path = "crates/formats" }
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-flight = "60.0.0"
# LZ4 for the IPC compression of DoGet streams, as mosaicod sends them.
arrow-ipc = { version = "60.0.0", features = ["lz4"] }
arrow-schema = "60.0.0"
av-metrics = "0.9.1"
butteraugli = "0.9.3"
clap = { version = "4.6.7", features = ["derive"] }
ffmpeg-the-third = "6.0.0"
futures = "0.3.34"
jpeg-encoder = "0.7.1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
png = "0.18.1"
prost = "0.14.4"
rayon = "1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssimulacra2 = "0.5.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "net", "sync"] }
tonic = "0.14.6"
uuid = { version = "1.28.0", features = ["v4"] }
zstd = { version = "0.14.2", features = ["zstdmt"] }
