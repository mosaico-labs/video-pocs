[package]
name = "poc1"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-buffer = "60.0.0"
arrow-flight = "60.0.0"
arrow-ipc = "60.0.0"
arrow-schema = "60.0.0"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
futures = "0.3.34"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
